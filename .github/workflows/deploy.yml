name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build web app
        env:
          # публічні адреса й anon-ключ Supabase (ті самі, що в MovieCasting і CookCasting); доступ до даних обмежує RLS
          SB_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          SB_URL="$(printf '%s' "$SB_URL" | tr -d '[:space:]')"
          # адреса проєкту Supabase (публічна, та сама, що в MovieCasting)
          [ -z "$SB_URL" ] && SB_URL="https://xiniojnshtldindforye.supabase.co"
          echo "Supabase URL: ${SB_URL:+є}${SB_URL:-немає}; ключ: ${EXPO_PUBLIC_SUPABASE_ANON_KEY:+є}${EXPO_PUBLIC_SUPABASE_ANON_KEY:-немає}"
          export EXPO_PUBLIC_SUPABASE_URL="$SB_URL"
          npx expo export --platform web --output-dir dist
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
