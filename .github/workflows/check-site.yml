name: Check site
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/check-site.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://zharoslaw31.github.io/InfoCasting
          curl -sSI "$B/" | grep -i "HTTP/\|last-modified\|cache-control\|age:"
          html=$(curl -sS "$B/?v=$RANDOM")
          echo "$html" | grep -o 'src="[^"]*entry-[^"]*"'
          js=$(echo "$html" | grep -o '/InfoCasting/_expo/static/js/web/entry-[a-f0-9]*\.js' | head -1)
          curl -sS "https://zharoslaw31.github.io$js" -o e.js; ls -la e.js
          for s in "Збережіть бібліотеку" "xiniojnshtldindforye" "Вийти з акаунта" "info_libraries"; do printf '%s: ' "$s"; grep -c "$s" e.js || true; done
